# Publishes WSO2 Identity Server on https://${WSO2_HOSTNAME} through Traefik.
# Traefik presents a Let's Encrypt certificate to clients and connects to WSO2 over
# HTTPS, checking WSO2's internal certificate against the internal CA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wso2is
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["${WSO2_HOSTNAME}"]
      secretName: wso2is-public-tls
  rules:
    - host: "${WSO2_HOSTNAME}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wso2is
                port:
                  name: servlet-https
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: wso2is
spec:
  serverName: wso2is.wso2is.svc
  rootCAs:
    - secret: wso2is-ca
