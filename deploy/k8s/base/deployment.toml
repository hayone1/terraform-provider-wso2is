# WSO2 Identity Server 7.x configuration for Kubernetes behind a TLS-terminating gateway.
#
# ${WSO2_HOSTNAME} is substituted at apply time (envsubst limited to that one variable,
# so WSO2's own $ref{...} and $env{...} placeholders are left alone).
# $env{...} values are read from the pod environment (Kubernetes Secrets) at start-up.

[server]
hostname = "${WSO2_HOSTNAME}"
node_ip = "127.0.0.1"
base_path = "https://$ref{server.hostname}"
# Server-to-itself calls go to https://localhost:9443. The internal TLS certificate
# names localhost and its CA is in the truststore, so these calls validate.
internal_hostname = "localhost"

[transport.https.properties]
proxyPort = 443

[super_admin]
username = "$env{WSO2_ADMIN_USERNAME}"
password = "$env{WSO2_ADMIN_PASSWORD}"
create_admin_account = true

[user_store]
type = "database_unique_id"

[database.identity_db]
type = "postgre"
url = "jdbc:postgresql://postgres:5432/WSO2_IDENTITY_DB?connectTimeout=10&amp;socketTimeout=60&amp;tcpKeepAlive=true"
username = "$env{DB_USERNAME}"
password = "$env{DB_PASSWORD}"
driver = "org.postgresql.Driver"

[database.identity_db.pool_options]
maxActive = "80"
maxWait = "60000"
minIdle = "5"
testOnBorrow = true
validationQuery = "SELECT 1; COMMIT"
validationInterval = "30000"
defaultAutoCommit = false
commitOnReturn = true

[database.shared_db]
type = "postgre"
url = "jdbc:postgresql://postgres:5432/WSO2_SHARED_DB?connectTimeout=10&amp;socketTimeout=60&amp;tcpKeepAlive=true"
username = "$env{DB_USERNAME}"
password = "$env{DB_PASSWORD}"
driver = "org.postgresql.Driver"

[database.shared_db.pool_options]
maxActive = "80"
maxWait = "60000"
minIdle = "5"
testOnBorrow = true
validationQuery = "SELECT 1; COMMIT"
validationInterval = "30000"
defaultAutoCommit = false
commitOnReturn = true

[datasource.AgentIdentity]
id = "AgentIdentity"
url = "jdbc:postgresql://postgres:5432/WSO2_AGENT_IDENTITY_DB?connectTimeout=10&amp;socketTimeout=60&amp;tcpKeepAlive=true"
username = "$env{DB_USERNAME}"
password = "$env{DB_PASSWORD}"
driver = "org.postgresql.Driver"

# Primary keystore signs tokens and encrypts internal data. The image default is kept for
# the lab; production deployments must replace it with their own keystore and password.
[keystore.primary]
file_name = "wso2carbon.p12"
password = "wso2carbon"
type = "PKCS12"

# TLS keystore served on 9443, built by scripts/prepare.sh from the cert-manager
# certificate in certificates.yaml (names: localhost and the in-cluster service).
[keystore.tls]
file_name = "tls.p12"
type = "PKCS12"
password = "$env{TLS_KEYSTORE_PASSWORD}"
alias = "wso2tls"
key_password = "$env{TLS_KEYSTORE_PASSWORD}"

# The image truststore with the internal CA imported (see scripts/prepare.sh).
[truststore]
file_name = "client-truststore.p12"
password = "wso2carbon"
type = "PKCS12"

[account_recovery.endpoint.auth]
hash = "$env{AUTH_ENDPOINT_APP_PASSWORD_SHA256}"

[identity.auth_framework.endpoint]
app_password = "$env{AUTH_ENDPOINT_APP_PASSWORD}"

[console]
callback_url = "regexp=(https://${WSO2_HOSTNAME}/console|https://${WSO2_HOSTNAME}/t/(.*)/console|https://${WSO2_HOSTNAME}/t/(.*)/o/(.*)/console)"

[myaccount]
callback_url = "regexp=(https://${WSO2_HOSTNAME}/myaccount|https://${WSO2_HOSTNAME}/t/(.*)/myaccount|https://${WSO2_HOSTNAME}/t/(.*)/o/(.*)/myaccount)"

# SMTP goes to the in-cluster Mailpit so tests can read verification and recovery mails.
[output_adapter.email]
from_address = "wso2is@lab.local"
username = "wso2is"
password = "wso2is"
hostname = "mailpit"
port = 1025
enable_start_tls = false
enable_authentication = false

# Allow DELETE /api/server/v1/tenants/{id}/metadata so wso2is_tenant can remove tenants.
# Leave it off in production unless tenants are meant to be deleted through the API.
[tenant_mgt]
tenant_deletion = true

# WSO2 IS 7.3.0 ships no access control rule for deleting the root organization's flows
# (DELETE /api/server/v1/flow answers 403); this lets wso2is_flow delete them.
[[resource.access_control]]
context = "(.*)/api/server/v1/flow(.*)"
secure = true
http_method = "DELETE"
scopes = ["internal_flow_update"]
