apiVersion: v1
kind: Service
metadata:
  name: wso2is
spec:
  selector:
    app.kubernetes.io/name: wso2is
  ports:
    - name: servlet-https
      port: 9443
      targetPort: 9443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wso2is
spec:
  replicas: 1
  strategy:
    # One server at a time: two versions of the server must not share the database
    # during an upgrade, and the caches of a single node are not clustered.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wso2is
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wso2is
    spec:
      securityContext:
        runAsUser: 802
        runAsGroup: 802
        fsGroup: 802
      initContainers:
        - name: prepare
          image: docker.io/wso2/wso2is:7.3.0
          command: ["sh", "/scripts/prepare.sh"]
          env:
            - name: TLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: tls-keystore-password }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: config, mountPath: /config }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: config-volume, mountPath: /config-volume }
            - { name: artifact-volume, mountPath: /artifact-volume }
            - { name: dbscripts, mountPath: /dbscripts }
        - name: db-init
          image: docker.io/library/postgres:17
          command: ["sh", "/scripts/db-init.sh"]
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: db-username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: db-password }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: dbscripts, mountPath: /dbscripts, readOnly: true }
      containers:
        - name: wso2is
          image: docker.io/wso2/wso2is:7.3.0
          env:
            - name: JVM_MEM_OPTS
              value: "-Xms1024m -Xmx2048m"
            - name: WSO2_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: admin-username }
            - name: WSO2_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: admin-password }
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: db-username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: db-password }
            - name: AUTH_ENDPOINT_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: auth-endpoint-app-password }
            - name: AUTH_ENDPOINT_APP_PASSWORD_SHA256
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: auth-endpoint-app-password-sha256 }
            - name: TLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef: { name: wso2is-credentials, key: tls-keystore-password }
          ports:
            - containerPort: 9443
              name: servlet-https
          startupProbe:
            httpGet: { path: /api/health-check/v1.0/health, port: 9443, scheme: HTTPS }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health-check/v1.0/health, port: 9443, scheme: HTTPS }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9443 }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: config-volume, mountPath: /home/wso2carbon/wso2-config-volume }
            - { name: artifact-volume, mountPath: /home/wso2carbon/wso2-artifact-volume }
      volumes:
        - name: scripts
          configMap: { name: wso2is-scripts }
        - name: config
          configMap: { name: wso2is-config }
        - name: tls
          secret: { secretName: wso2is-tls }
        - { name: config-volume, emptyDir: {} }
        - { name: artifact-volume, emptyDir: {} }
        - { name: dbscripts, emptyDir: {} }
---
# Catches every mail WSO2 sends; tests read it through the Mailpit API on 8025.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: http, port: 8025, targetPort: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:v1.33
          ports:
            - { containerPort: 1025, name: smtp }
            - { containerPort: 8025, name: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
