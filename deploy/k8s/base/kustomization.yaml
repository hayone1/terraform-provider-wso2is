apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wso2is
labels:
  - pairs:
      app.kubernetes.io/part-of: wso2is
resources:
  - namespace.yaml
  - certificates.yaml
  - postgres.yaml
  - wso2is.yaml
configMapGenerator:
  - name: wso2is-config
    files:
      - deployment.toml
  - name: wso2is-scripts
    files:
      - scripts/prepare.sh
      - scripts/db-init.sh
