version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - predeclared
    - unconvert
    - usestdlibvars
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    paths:
      - _debug

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - _debug
